name: Testing

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Test
        run: |
          chronumental --dates ./test_data/ebola.metadata.csv --tree ./test_data/divergence_tree.nexus --dates_out dates_chron.tsv --tree_out tree_chron.nwk --steps 200 --treat_mutation_units_as_normalised_to_genome_size 19000
      - name: Test learnt clock variance
        run: |
          chronumental --dates ./test_data/ebola.metadata.csv --tree ./test_data/divergence_tree.nexus --dates_out dates_var.tsv --tree_out tree_var.nwk --steps 20 --variance_on_clock_rate --treat_mutation_units_as_normalised_to_genome_size 19000
